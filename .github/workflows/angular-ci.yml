name: Angular CI

# when run this action?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest # run on linux server

    steps:
    - name: 📥 Kéo code về máy chủ
      uses: actions/checkout@v4

    - name: ⚙️ Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Node 20+ with Angular 21
        cache: 'npm'

    - name: 📦 Cài đặt thư viện (Dependencies)
      # Caution: Thêm --legacy-peer-deps để tránh xung đột phiên bản Firebase
      run: npm ci --legacy-peer-deps 

    - name: 🛠️ Build thử Project
      run: npm run build

    # (Opt.) Nếu có viết Unit Test, có thể mở comment dòng dưới
    # - name: 🧪 Chạy Test
    #   run: npm run test -- --watch=false --browsers=ChromeHeadless