<div class="space-y-6">
  
  <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b border-gray-200 pb-5">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Quản lý Tài khoản</h1>
      <p class="text-sm text-gray-500 mt-1">Hệ thống hiện có 1,204 người dùng.</p>
    </div>
    
    <div class="flex flex-wrap items-center gap-3">
      <button (click)="exportExcel()" [disabled]="isExporting()"
              class="inline-flex items-center px-4 py-2 bg-green-50 text-green-700 border border-green-200 rounded-lg hover:bg-green-100 font-medium transition text-sm disabled:opacity-50 disabled:cursor-not-allowed">
        
        @if (isExporting()) {
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-green-700" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Đang xuất file...
        } @else {
          <span class="mr-2">📊</span> Xuất Excel
        }
      </button>
      
      <label class="inline-flex items-center px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-medium transition cursor-pointer text-sm shadow-sm"
             [class.opacity-50]="isUploading()" [class.pointer-events-none]="isUploading()">
        
        @if (isUploading()) {
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Đang xử lý...
        } @else {
          <span class="mr-2">📁</span> Nhập danh sách
        }
        
        <input type="file" class="hidden" accept=".xlsx, .xls" (change)="onFileSelected($event)">
      </label>

      <button class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition shadow-sm text-sm">
        + Thêm User
      </button>
    </div>
  </div>

  <div class="flex gap-4 mb-4">
    <input type="text" placeholder="Tìm kiếm tên, email, mã số..." class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    <select class="px-4 py-2 border border-gray-300 rounded-lg bg-white outline-none">
      <option value="">Tất cả Vai trò</option>
      <option value="Admin">Quản trị viên</option>
      <option value="Instructor">Giảng viên</option>
      <option value="Student">Học viên</option>
    </select>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Họ và Tên</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Vai trò</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Trạng thái</th>
          <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Hành động</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 bg-white">
        @for (i of [1,2,3]; track i) {
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4">
              <div class="flex items-center">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold">NV</div>
                <div class="ml-4">
                  <div class="text-sm font-bold text-gray-900">Nguyễn Văn A</div>
                  <div class="text-sm text-gray-500">nguyenvana@gmail.com</div>
                </div>
              </div>
            </td>
            <td class="px-6 py-4">
              <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-purple-100 text-purple-800">
                Học viên
              </span>
            </td>
            <td class="px-6 py-4">
               <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                Hoạt động
              </span>
            </td>
            <td class="px-6 py-4 text-right text-sm font-medium">
              <button class="text-blue-600 hover:text-blue-900 mr-3">Sửa</button>
              <button class="text-red-600 hover:text-red-900">Khóa</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

</div>
