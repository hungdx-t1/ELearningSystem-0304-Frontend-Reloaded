<div class="min-h-[80vh] flex flex-col items-center justify-center bg-transparent px-4 sm:px-6 lg:px-8">
  <div class="text-center max-w-lg">
    
    <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-blue-100 mb-8 animate-pulse">
      <svg class="w-12 h-12 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    
    <h1 class="text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">Sắp ra mắt!</h1>
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Tính năng đang được phát triển</h2>
    <p class="text-lg text-gray-500 mb-8">
      Đội ngũ của chúng tôi đang làm việc chăm chỉ để hoàn thiện chức năng này. Vui lòng quay lại sau nhé!
    </p>
    
    <button (click)="goBack()"
       class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-lg shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
      <svg class="mr-2 -ml-1 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Quay lại trang trước

  </div>
</div>
